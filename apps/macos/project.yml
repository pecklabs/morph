name: Morph
options:
  bundleIdPrefix: ai.psdn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.8.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: 4P8783Z9RM
    PRODUCT_NAME: Morph
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Morph:
    type: application
    platform: macOS
    sources:
      - path: Morph
    dependencies:
      - package: Sparkle
    info:
      path: Morph/Info.plist
      properties:
        CFBundleDisplayName: Morph
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        LSUIElement: false
        # Sparkle auto-update
        SUFeedURL: https://raw.githubusercontent.com/pecklabs/morph/main/appcast.xml
        SUPublicEDKey: nPiJbULahvPzeQB+20YmZR1d1DkEvkHr1J7NZU5rSBg=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.psdn.morph
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: morph-icon
